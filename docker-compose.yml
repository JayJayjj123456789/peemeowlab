name: ${TEAM}

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  networks: [app]

services:
  searxng:
    <<: *common
    build:
      context: ./searxng
      dockerfile: Dockerfile
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend:
    <<: *common
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_LINE_CHANNEL_ID:          "${APP_VITE_LINE_LOGIN_CHANNEL_ID:-${APP_VITE_LINE_CHANNEL_ID:-}}"
        VITE_LINE_LOGIN_CHANNEL_ID:    "${APP_VITE_LINE_LOGIN_CHANNEL_ID:-2011083265}"
        VITE_GOOGLE_CLIENT_ID:         "${APP_VITE_GOOGLE_CLIENT_ID:-}"
        VITE_APP_ID:                   "${APP_VITE_APP_ID:-}"
        VITE_OAUTH_PORTAL_URL:         "${APP_VITE_OAUTH_PORTAL_URL:-}"
        VITE_FRONTEND_FORGE_API_URL:   "${APP_VITE_FRONTEND_FORGE_API_URL:-}"
        # Forge proxy key for Maps — domain-restricted, low-risk frontend use
        VITE_FRONTEND_FORGE_API_KEY:   "${APP_VITE_FRONTEND_FORGE_API_KEY:-}"
        # NOTE: VITE_PATHUMMA_API_KEY and VITE_THAILLM_API_KEY intentionally excluded
        # (guiderule §12 — secrets must stay server-side; api/ handlers manage auth)
    ports:
      - "127.0.0.1:${BASE}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
      searxng:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  api:
    <<: *common
    build: ./api
    ports:
      - "127.0.0.1:${BASE_1}:8000"
    env_file:
      - .env
    environment:
      ROOT_PATH: /api
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${TEAM:-team07}pass@db:5432/app
      SEARXNG_URL: "http://searxng:8080"
      WEB_API_SECRET:              "${APP_WEB_API_SECRET:-}"
      OTP_PEPPER:                  "${APP_OTP_PEPPER:-jkj}"
      TOKENMIND_API_KEY:           "${APP_TOKENMIND_API_KEY}"
      TYPHOON_ASR_KEY:             "${APP_TYPHOON_ASR_KEY}"
      LINE_CHANNEL_SECRET:         "${APP_LINE_CHANNEL_SECRET}"
      LINE_CHANNEL_ACCESS_TOKEN:   "${APP_LINE_CHANNEL_ACCESS_TOKEN}"
      LINE_LOGIN_CHANNEL_ID:       "${APP_LINE_LOGIN_CHANNEL_ID:-2011083265}"
      LINE_LOGIN_CHANNEL_SECRET:   "${APP_LINE_LOGIN_CHANNEL_SECRET:-${APP_LINE_CHANNEL_SECRET}}"
      PATHUMMA_API_KEY:            "${APP_PATHUMMA_API_KEY}"
      TAVILY_API_KEY:              "${APP_TAVILY_API_KEY}"
      GEMINI_API_KEY:              "${APP_GEMINI_API_KEY}"
      ENCRYPTION_KEY:              "${APP_ENCRYPTION_KEY:-}"
      ADMIN_EMAIL:                 "${APP_ADMIN_EMAIL:-}"
      SMTP_USER:                   "${APP_SMTP_USER:-}"
      SMTP_PASS:                   "${APP_SMTP_PASS:-}"
    volumes:
      - /data/hack/${TEAM:-team07}/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${TEAM:-team07}pass
      POSTGRES_DB: app
    volumes:
      - /data/hack/${TEAM:-team07}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

networks:
  app:
    driver: bridge
